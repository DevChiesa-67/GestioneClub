<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestione Club — Connessione assente</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #050505;
        color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        text-align: center;
      }

      .box {
        max-width: 420px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
      }

      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #a1a1aa;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 800;
        color: #ffffff;
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Sei offline</h1>
      <p>
        Il gestionale ha bisogno della connessione. Controlla la rete e
        riprova.
      </p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </div>
  </body>
</html>
